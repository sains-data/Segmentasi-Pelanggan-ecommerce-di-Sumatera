# docker-compose.yml
version: '3.8'

x-superset-volumes: &superset-volumes
  - ./docker:/app/docker
  - superset_home:/app/superset_home

x-common-build: &common-build
  context: .
  target: dev
  cache_from:
    - apache/superset-cache:3.10-slim-bookworm

services:
  # ZooKeeper for coordination
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    hostname: zookeeper
    container_name: zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zk-data:/var/lib/zookeeper/data
      - zk-logs:/var/lib/zookeeper/log

  # Hadoop NameNode
  namenode:
    build:
      context: ./dockerfiles/hadoop-base
      dockerfile: Dockerfile
    hostname: namenode
    container_name: namenode
    ports:
      - "9870:9870"
      - "9000:9000"
    environment:
      - CLUSTER_NAME=bigdata-cluster
      - CORE_CONF_fs_defaultFS=hdfs://namenode:9000
      - HDFS_CONF_dfs_replication=2
    volumes:
      - namenode-data:/hadoop/dfs/name
      - ./configs/hadoop:/opt/hadoop/etc/hadoop:ro
    command: ["hdfs", "namenode"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9870"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Hadoop DataNode
  datanode1:
    build:
      context: ./dockerfiles/hadoop-base
      dockerfile: Dockerfile
    hostname: datanode1
    container_name: datanode1
    ports:
      - "9864:9864"
    environment:
      - CORE_CONF_fs_defaultFS=hdfs://namenode:9000
    volumes:
      - datanode1-data:/hadoop/dfs/data
      - ./configs/hadoop:/opt/hadoop/etc/hadoop:ro
    depends_on:
      namenode:
        condition: service_healthy
    command: ["hdfs", "datanode"]

  datanode2:
    build:
      context: ./dockerfiles/hadoop-base
      dockerfile: Dockerfile
    hostname: datanode2
    container_name: datanode2
    ports:
      - "9865:9864"
    environment:
      - CORE_CONF_fs_defaultFS=hdfs://namenode:9000
    volumes:
      - datanode2-data:/hadoop/dfs/data
      - ./configs/hadoop:/opt/hadoop/etc/hadoop:ro
    depends_on:
      namenode:
        condition: service_healthy
    command: ["hdfs", "datanode"]

  # YARN ResourceManager
  resourcemanager:
    build:
      context: ./dockerfiles/hadoop-base
      dockerfile: Dockerfile
    hostname: resourcemanager
    container_name: resourcemanager
    ports:
      - "8088:8088"
      - "8030:8030"
      - "8031:8031"
      - "8032:8032"
    environment:
      - YARN_CONF_yarn_resourcemanager_hostname=resourcemanager
      - YARN_CONF_yarn_resourcemanager_address=resourcemanager:8032
      - YARN_CONF_yarn_resourcemanager_scheduler_address=resourcemanager:8030
      - YARN_CONF_yarn_resourcemanager_resource___tracker_address=resourcemanager:8031
    volumes:
      - ./configs/hadoop:/opt/hadoop/etc/hadoop:ro
    depends_on:
      namenode:
        condition: service_healthy
    command: ["yarn", "resourcemanager"]

  # YARN NodeManager
  nodemanager1:
    build:
      context: ./dockerfiles/hadoop-base
      dockerfile: Dockerfile
    hostname: nodemanager1
    container_name: nodemanager1
    ports:
      - "8042:8042"
    environment:
      - YARN_CONF_yarn_resourcemanager_hostname=resourcemanager
      - YARN_CONF_yarn_nodemanager_resource_memory___mb=4096
      - YARN_CONF_yarn_nodemanager_resource_cpu___vcores=2
    volumes:
      - ./configs/hadoop:/opt/hadoop/etc/hadoop:ro
    depends_on:
      - resourcemanager
    command: ["yarn", "nodemanager"]

  # Hive Metastore Database
  hive-metastore-db:
    image: postgres:13
    hostname: hive-metastore-db
    container_name: hive-metastore-db
    environment:
      POSTGRES_DB: metastore
      POSTGRES_USER: hive
      POSTGRES_PASSWORD: hive123
    volumes:
      - hive-metastore-db:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  # Hive Metastore Service
  hive-metastore:
    build:
      context: ./dockerfiles/hive
      dockerfile: Dockerfile
    hostname: hive-metastore
    container_name: hive-metastore
    ports:
      - "10000:10000"
    environment:
      - HIVE_METASTORE_URI=thrift://hive-metastore:10000
    volumes:
      - ./configs/hive:/opt/hive/conf:ro
    depends_on:
      - hive-metastore-db
      - namenode
    command: ["hive", "--service", "metastore"]

  # HiveServer2
  hiveserver2:
    build:
      context: ./dockerfiles/hive
      dockerfile: Dockerfile
    hostname: hiveserver2
    container_name: hiveserver2
    ports:
      - "10000:10000"
      - "10002:10002"
    environment:
      - HIVE_METASTORE_URI=thrift://hive-metastore:10000
    volumes:
      - ./configs/hive:/opt/hive/conf:ro
    depends_on:
      - hive-metastore
    command: ["hive", "--service", "hiveserver2"]

  # Spark Master
  spark-master:
    build:
      context: ./dockerfiles/spark
      dockerfile: Dockerfile
    hostname: spark-master
    container_name: spark-master
    ports:
      - "8080:8080"
      - "7077:7077"
    environment:
      - SPARK_MODE=master
      - SPARK_MASTER_HOST=spark-master
      - HIVE_METASTORE_URI=thrift://hive-metastore:10000
    volumes:
      - ./configs/spark:/opt/spark/conf:ro
      - ./scripts:/opt/scripts
      - ./notebooks:/opt/notebooks
    depends_on:
      - hive-metastore
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.master.Master"]

  # Spark Worker
  spark-worker1:
    build:
      context: ./dockerfiles/spark
      dockerfile: Dockerfile
    hostname: spark-worker1
    container_name: spark-worker1
    ports:
      - "8081:8081"
    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://spark-master:7077
      - SPARK_WORKER_CORES=2
      - SPARK_WORKER_MEMORY=4g
    volumes:
      - ./configs/spark:/opt/spark/conf:ro
    depends_on:
      - spark-master
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker", "spark://spark-master:7077"]

  spark-worker2:
    build:
      context: ./dockerfiles/spark
      dockerfile: Dockerfile
    hostname: spark-worker2
    container_name: spark-worker2
    ports:
      - "8082:8081"
    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://spark-master:7077
      - SPARK_WORKER_CORES=2
      - SPARK_WORKER_MEMORY=4g
    volumes:
      - ./configs/spark:/opt/spark/conf:ro
    depends_on:
      - spark-master
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker", "spark://spark-master:7077"]

  # Sqoop Service
  sqoop:
    build:
      context: ./dockerfiles/sqoop
      dockerfile: Dockerfile
    hostname: sqoop
    container_name: sqoop
    volumes:
      - ./data/csv:/data/csv
      - ./scripts/ingestion:/scripts
      - ./configs/hadoop:/opt/hadoop/etc/hadoop:ro
    depends_on:
      - namenode
      - hive-metastore
    profiles:
      - ingestion

  # Jupyter Notebook for Development
  jupyter:
    build:
      context: ./dockerfiles/spark
      dockerfile: Dockerfile.jupyter
    hostname: jupyter
    container_name: jupyter
    ports:
      - "8888:8888"
    environment:
      - JUPYTER_ENABLE_LAB=yes
      - SPARK_MASTER_URL=spark://spark-master:7077
      - HIVE_METASTORE_URI=thrift://hive-metastore:10000
    volumes:
      - ./notebooks:/home/jovyan/work
      - ./scripts:/home/jovyan/scripts
      - ./configs:/home/jovyan/configs
    depends_on:
      - spark-master
      - hive-metastore

  # Apache Superset
  redis:
    image: redis:7
    container_name: superset_cache
    restart: unless-stopped
    volumes:
      - redis:/data
    profiles:
      - visualization

  superset-db:
    image: postgres:16
    container_name: superset_db
    restart: unless-stopped
    env_file:
      - path: docker/.env
        required: true
      - path: docker/.env-local
        required: false
    volumes:
      - db_home:/var/lib/postgresql/data
      - ./docker/docker-entrypoint-initdb.d:/docker-entrypoint-initdb.d
    profiles:
      - visualization

  superset-init:
    build:
      <<: *common-build
    container_name: superset_init
    command: ["/app/docker/docker-init.sh"]
    env_file:
      - path: docker/.env
        required: true
      - path: docker/.env-local
        required: false
    depends_on:
      superset-db:
        condition: service_started
      redis:
        condition: service_started
    user: "root"
    volumes: *superset-volumes
    environment:
      SUPERSET_LOAD_EXAMPLES: "${SUPERSET_LOAD_EXAMPLES:-yes}"
      SUPERSET_LOG_LEVEL: "${SUPERSET_LOG_LEVEL:-info}"
    healthcheck:
      disable: true
    profiles:
      - visualization

  superset:
    build:
      <<: *common-build
    container_name: superset_app
    command: ["/app/docker/docker-bootstrap.sh", "app-gunicorn"]
    env_file:
      - path: docker/.env
        required: true
      - path: docker/.env-local
        required: false
    ports:
      - "8088:8088"
    depends_on:
      superset-init:
        condition: service_completed_successfully
    user: "root"
    restart: unless-stopped
    volumes: *superset-volumes
    environment:
      SUPERSET_LOG_LEVEL: "${SUPERSET_LOG_LEVEL:-info}"
    profiles:
      - visualization

  superset-worker:
    build:
      <<: *common-build
    container_name: superset_worker
    command: ["/app/docker/docker-bootstrap.sh", "worker"]
    env_file:
      - path: docker/.env
        required: true
      - path: docker/.env-local
        required: false
    restart: unless-stopped
    depends_on:
      superset-init:
        condition: service_completed_successfully
    user: "root"
    volumes: *superset-volumes
    environment:
      SUPERSET_LOG_LEVEL: "${SUPERSET_LOG_LEVEL:-info}"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "celery -A superset.tasks.celery_app:app inspect ping -d celery@$$HOSTNAME"
        ]
    profiles:
      - visualization

  superset-worker-beat:
    build:
      <<: *common-build
    container_name: superset_worker_beat
    command: ["/app/docker/docker-bootstrap.sh", "beat"]
    env_file:
      - path: docker/.env
        required: true
      - path: docker/.env-local
        required: false
    restart: unless-stopped
    depends_on:
      superset-init:
        condition: service_completed_successfully
    user: "root"
    volumes: *superset-volumes
    environment:
      SUPERSET_LOG_LEVEL: "${SUPERSET_LOG_LEVEL:-info}"
    healthcheck:
      disable: true
    profiles:
      - visualization

volumes:
  zk-data:
  zk-logs:
  namenode-data:
  datanode1-data:
  datanode2-data:
  hive-metastore-db:
  superset-db:
  superset_home:
  db_home:
  redis:

networks:
  default:
    name: bigdata-network